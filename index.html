<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Co-Pilot Onboarding</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; max-width: 500px; margin: auto; }
        .card { background: #1e293b; padding: 20px; border-radius: 8px; margin-top: 20px; }
        input, select { width: 100%; padding: 10px; margin: 10px 0; border-radius: 4px; border: 1px solid #475569; background: #334155; color: white; box-sizing: border-box; }
        .dropdown-results { background: #334155; border: 1px solid #475569; max-height: 150px; overflow-y: auto; border-radius: 4px; display: none; }
        .dropdown-item { padding: 10px; cursor: pointer; }
        .dropdown-item:hover { background: #475569; }
    </style>
</head>
<body>

    <h1>🌌 Cosmic Co-Pilot</h1>
    <p>Let's map out a profile to find their hidden rising sign.</p>

    <div class="card">
        <h3>Step 1: Enter Birth Information</h3>
        <label>Birth Date</label>
        <input type="date" id="birthdate">

        <label>Search Birth City</label>
        <input type="text" id="city-search" placeholder="Type a city (e.g. Roberval, Paris)..." autocomplete="off">
        <div id="city-results" class="dropdown-results"></div>
    </div>

    <script>
        const cityInput = document.getElementById('city-search');
        const cityResults = document.getElementById('city-results');

        // Automatically search cities when typing
        cityInput.addEventListener('input', async () => {
            const query = cityInput.value.trim();
            if (query.length < 3) {
                cityResults.style.display = 'none';
                return;
            }

            // Fetches matching global cities from a public database
            try {
                const response = await fetch(`https://geonames.org{query}&maxRows=5&username=demo`);
                const data = await response.json();
                
                cityResults.innerHTML = '';
                if (data.geonames && data.geonames.length > 0) {
                    cityResults.style.display = 'block';
                    data.geonames.forEach(city => {
                        const div = document.createElement('div');
                        div.className = 'dropdown-item';
                        div.innerText = `${city.name}, ${city.adminName1} (${city.countryName})`;
                        
                        // When clicked, lock it into the text box
                        div.addEventListener('click', () => {
                            cityInput.value = `${city.name}, ${city.adminName1} (${city.countryName})`;
                            cityResults.style.display = 'none';
                        });
                        cityResults.appendChild(div);
                    });
                }
            } catch (err) {
                console.log("Error loading cities");
            }
        });
    </script>
</body>
</html>
