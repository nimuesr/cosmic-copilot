<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Co-Pilot Onboarding</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; max-width: 500px; margin: auto; }
        .card { background: #1e293b; padding: 20px; border-radius: 8px; margin-top: 20px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 4px; border: 1px solid #475569; background: #334155; color: white; box-sizing: border-box; }
        .dropdown-results { background: #334155; border: 1px solid #475569; max-height: 180px; overflow-y: auto; border-radius: 4px; display: none; position: absolute; width: calc(100% - 80px); max-width: 420px; z-index: 10; }
        .dropdown-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #475569; }
        .dropdown-item:hover { background: #475569; }
    </style>
</head>
<body>

    <h1>🌌 Cosmic Co-Pilot</h1>
    <p>Look up anyone's birth chart parameters and cross-reference milestones.</p>

    <div class="card" style="position: relative;">
        <h3>Profile Entry</h3>
        <label>Birth Date</label>
        <input type="date" id="birthdate">

        <label>Search Birth City</label>
        <input type="text" id="city-search" placeholder="Type city (e.g. Roberval, Paris, Montreal)..." autocomplete="off">
        <div id="city-results" class="dropdown-results"></div>
    </div>

    <script>
        const cityInput = document.getElementById('city-search');
        const cityResults = document.getElementById('city-results');

        // Automatically fetch real cities while you type
        cityInput.addEventListener('input', async () => {
            const query = cityInput.value.trim();
            if (query.length < 3) {
                cityResults.style.display = 'none';
                return;
            }

            try {
                // Queries the open public geocoding database instantly
                const response = await fetch(`https://openstreetmap.org{encodeURIComponent(query)}&limit=5`);
                const data = await response.json();
                
                cityResults.innerHTML = '';
                if (data && data.length > 0) {
                    cityResults.style.display = 'block';
                    data.forEach(place => {
                        const div = document.createElement('div');
                        div.className = 'dropdown-item';
                        div.innerText = place.display_name;
                        
                        // Selects city name when clicked
                        div.addEventListener('click', () => {
                            cityInput.value = place.display_name;
                            cityResults.style.display = 'none';
                        });
                        cityResults.appendChild(div);
                    });
                } else {
                    cityResults.style.display = 'none';
                }
            } catch (err) {
                console.log("Database connection error");
            }
        });

        // Hide list if user clicks away
        document.addEventListener('click', (e) => {
            if (e.target !== cityInput) cityResults.style.display = 'none';
        });
    </script>
</body>
</html>
